server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: airport-platform
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:AIRPORT_APP}
    password: ${DB_PASSWORD:Airport12345}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
app:
  security:
    jwt-secret: ${JWT_SECRET:change-this-super-long-secret-change-this-super-long-secret}
    access-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-days: ${JWT_REFRESH_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8081}
  payment:
    approval-rate: ${PAYMENT_APPROVAL_RATE:0.92}
  mail:
    from: ${MAIL_FROM:reservas@tagairlines.local}
springdoc:
  swagger-ui.path: /swagger-ui.html
  api-docs.path: /v3/api-docs
