server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: airport-platform
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:AIRPORT_APP}
    password: ${DB_PASSWORD:Airport12345}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints.web.exposure.include: health,info,metrics
  endpoint.health.probes.enabled: true
app:
  security:
    jwt-secret: ${JWT_SECRET:change-this-super-long-secret-change-this-super-long-secret}
    access-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-days: ${JWT_REFRESH_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8081}
  payment:
    approval-rate: ${PAYMENT_APPROVAL_RATE:0.92}
springdoc:
  swagger-ui.path: /swagger-ui.html
  api-docs.path: /v3/api-docs
